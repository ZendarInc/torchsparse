# These version constraints come from Zendar's internal libraries that
# require this package, just to reduce the chance of version
# inconsistencies.

[[tool.pdm.source]]
url = "https://download.pytorch.org/whl/cu128"
verify_ssl = true
name = "torch-cu128"
type = "find-links"


[project]
name = "torchsparseplusplus"
description = ""
authors = []
dependencies = [
    "torch==2.7.0+cu128",
    "tqdm",
    "numpy",
    "setuptools",
    "wheel",
    "rootpath",
    "attributedict",
    "typing-extensions",
]
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = {text = "MIT"}
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "torchsparseplusplus.__version__"}

[build-system]
requires = [
    "torch==2.7.0+cu128",
    "tqdm", "numpy",
    "setuptools",
    "wheel",
    "rootpath",
    "attributedict",
    "typing-extensions"
]
